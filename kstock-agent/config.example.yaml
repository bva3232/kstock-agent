# config.yaml 로 복사해서 사용하세요. (config.yaml 은 .gitignore 대상)

dart:
  # https://opendart.fss.or.kr 에서 무료 발급 (분당 호출 제한 있음)
  api_key: "여기에_DART_API_KEY"

account:
  seed_krw: 1000000          # 시드머니
  max_positions: 4           # 최대 동시 보유 종목수
  risk_per_trade: 0.02       # 1회 거래당 감내 손실 = 계좌의 2%
  stop_loss_atr_mult: 2.0    # 손절선 = 진입가 - ATR * 2
  # 왕복 거래비용 추정치(%). 증권거래세+농특세+증권사 수수료.
  # 실제 세율/수수료는 반드시 본인 계좌 기준으로 확인해서 수정하세요.
  roundtrip_cost_pct: 0.30
  # 프로세스2 핵심 종목 (마감 후/개장 전 항상 분석)
  core_tickers: ["000660", "005930"]

universe:
  markets: ["KOSPI", "KOSDAQ"]
  min_market_cap_krw: 100000000000   # 시총 1,000억 미만 제외
  min_avg_turnover_krw: 1000000000   # 20일 평균 거래대금 10억 미만 제외
  exclude_keywords: ["스팩", "리츠", "우B", "우C"]   # 종목명 기반 제외
  exclude_preferred: true            # 우선주 제외
  max_pbr: 8.0                       # 극단 밸류 제외 (0 이면 미적용)

screen:
  lookback_days: 90        # 지표 계산용 과거 영업일 수
  top_n: 10                # 리포트에 실을 상위 종목 수

paths:
  cache_dir: "./.cache"
  output_dir: "./reports"
